name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: |
          packageManager=$(node -p "require('./package.json').packageManager")
          npmVersion=${packageManager#npm@}
          npm install --global "npm@$npmVersion"
          test "$(npm --version)" = "$npmVersion"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # Pure unit tests mock electron; skip binary download if anything imports it
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build
        run: npm run build
